<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentryBox | Admin has moved</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); background: radial-gradient(900px 600px at 70% 0%, rgba(214, 40, 40, .16), transparent 60%), #0b0c0e; color: #f2f1ee; font: 16px/1.55 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: 100%; max-width: 520px; }
h1 { margin: 0 0 14px; font-size: clamp(34px, 8vw, 52px); line-height: .98; font-weight: 800; text-transform: uppercase; letter-spacing: -.02em; text-wrap: balance; }
h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; text-transform: none; color: #e5383b; letter-spacing: 0; }
p { margin: 0 0 22px; color: #b9b7b1; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; background: #e5383b; color: #fff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.old { margin-top: 34px; padding: 20px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); }
.old p { margin-bottom: 14px; color: #dcdad5; }
.old .btn { background: transparent; border-color: rgba(255, 255, 255, .3); color: #f2f1ee; }
.small { margin: 12px 0 0; font-size: 14px; color: #98968f; }
</style>
</head>
<body>
<main>
  <h1>The admin <em>has moved.</em></h1>
  <p>Quotes, invoices and website requests now live at a new address, behind your email sign-in.</p>
  <a class="btn" href="https://admin.sentrysecurityla.com/">Open the admin</a>

  <div class="old" id="old" hidden>
    <p id="oldmsg"></p>
    <button class="btn" id="exp" type="button">Save backup file</button>
    <p class="small" id="bakmsg">Then open the admin, go to Settings and choose "Load backup file".</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  /* The old page kept a copy of the signing key in this browser. It is no longer used here. */
  try { localStorage.removeItem('sb.key'); } catch (e) {}

  var read = function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  var quotes = read('sb.quotes', []), settings = read('sb.settings', {});
  if (!Array.isArray(quotes) || !quotes.length) return;

  var $ = function (id) { return document.getElementById(id); };
  $('oldmsg').textContent = 'This browser still holds ' + quotes.length + ' quote' + (quotes.length === 1 ? '' : 's') + ' made on the old page. Save them to a file so you can load them into the new admin.';
  $('old').hidden = false;
  $('exp').addEventListener('click', function () {
    var d = new Date(), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var blob = new Blob([JSON.stringify({ sentrybox: 1, settings: settings, quotes: quotes }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sentrybox-quotes-' + stamp + '.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    $('bakmsg').textContent = 'Saved to your downloads. Now open the admin, go to Settings and choose "Load backup file".';
  });
})();
</script>
</body>
</html>
